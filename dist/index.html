graph of an unbranded perfume bottle and sample vial in warm light"><div class="hero-copy"><div class="eyebrow">A little discovery. A lasting impression.</div><h1>A scent that<br>feels like <em>you.</em></h1><p>From your first perfume to your next obsession. Discover beautiful fragrances, one sample at a time.</p><button class="primary" data-action="finder">Find my fragrance ↗</button><p style="font-size:11px;margin:18px 0 0">No scent vocabulary needed.</p></div><div class="hero-note">01 / Curated for discovery<br><span class="muted">Sample first. Let your skin decide.</span></div></section><div class="underhero"><span>◇ Prices in Nigerian naira</span><span>◇ 2 ml samples & full bottles</span><span>◇ Delivery estimates by state</span></div>${collection()}<section class="story"><div><div class="eyebrow">Small bottle. Better decision.</div><h2>Meet your perfume<br>before you commit.</h2><p>A note list can only tell you so much. Wear a sample, live with it, and see how it feels on your skin.</p><button class="link" data-action="samples">Build a sample wardrobe →</button></div><div class="steps"><p><span>01</span>Choose a few scents that catch your curiosity.</p><p><span>02</span>Try them on different days, at your own pace.</p><p><span>03</span>Come back for the bottle you love.</p></div></section>${footer()}`}
const questions=[{key:'mood',title:'What feels most like you?',hint:'Go with a feeling. There is no wrong answer.',options:['Fresh','Woody','Warm','Help me explore']},{key:'budget',title:'What is your bottle budget?',hint:'Demo samples start at ₦2,500.',options:['Under ₦50,000','₦50,000–₦75,000','Up to ₦100,000','Just exploring']},{key:'occasion',title:'When will you wear it?',hint:'A starting point, rather than a rule.',options:['Everyday','Work & close spaces','Evenings','A gift']}];
function match(){const cap=state.answers.budget==='Under ₦50,000'?50000:state.answers.budget==='₦50,000–₦75,000'?75000:100000;const eligible=products.filter(p=>p.price<=cap);const preferred=state.answers.mood;const occasionMood=state.answers.occasion==='Evenings'?'Warm':'Fresh';return eligible.find(p=>p.mood===preferred)||eligible.find(p=>p.mood===occasionMood)||eligible[0]}
function quiz(){if(state.quizStep===3&&state.answers.occasion==='A gift'){return `<div class="eyebrow">Your discovery starting point</div><h2>Give them room to discover.</h2><p class="muted">A three-scent sample set lets them explore fresh, woody and warm profiles before committing to a bottle.</p><p style="font-size:12px;margin:20px 0">Suggested because you are buying a gift. This demo set is ₦10,500 before illustrative delivery.</p><button class="primary" data-action="samples">Explore the discovery set →</button><button class="link" data-action="resetquiz">Start again</button>`}if(state.quizStep===3){const p=match();return `<div class="eyebrow">Your discovery starting point</div><div class="progress"><i class="on"></i><i class="on"></i><i class="on"></i></div><h2>${p.name}</h2><p class="muted">${p.description}</p><p style="font-size:12px;margin:20px 0">${p.mood===state.answers.mood?"Matches your chosen scent feeling":"An alternative within your budget"}. We prioritize your scent feeling and budget, then use occasion as a fallback. Your skin experience may differ.</p><button class="primary" data-action="product" data-id="${p.id}">Try a ${money(p.sample)} sample →</button><button class="link" data-action="resetquiz">Start again</button>`}const q=questions[state.quizStep];return `<div class="eyebrow">Your scent finder / 0${state.quizStep+1}</div><div class="progress">${questions.map((_,i)=>`<i class="${i<=state.quizStep?'on':''}"></i>`).join('')}</div><h2>${q.title}</h2><p class="muted" style="font-size:12px">${q.hint}</p><div class="choices">${q.options.map(o=>`<button class="choice ${state.answers[q.key]===o?'selected':''}" data-choice="${esc(o)}" aria-pressed="${state.answers[q.key]===o}">${o}<span>${state.answers[q.key]===o?'●':'○'}</span></button>`).join('')}</div><div class="quiznav"><button class="link" data-action="quizback">${state.quizStep?'← Back':'Skip to browse'}</button><button class="primary" data-action="quiznext">${state.quizStep===2?'See my suggestion':'Continue'} →</button></div>`}
function guided(){return `${header()}<section class="finder fade"><div class="finder-copy"><div class="eyebrow">Good perfume. No guesswork.</div><h1>Your scent<br>story starts<br><em>here.</em></h1><p>Tell us what you like. We’ll give you a starting point to explore, with samples before full bottles.</p><p style="font-size:11px;margin-top:25px">Three questions · No account needed</p></div><div class="quiz" id="quiz">${quiz()}</div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Go your own way</div><h2>However you like to discover.</h2></div></div><div class="paths"><div class="path"><span class="eyebrow">01 / First fragrance</span><h3>Keep it simple.</h3><p>Everyday scents, clear descriptions, and a small sample to get you started.</p><button class="link" data-action="browse">Explore the edit →</button></div><div class="path"><span class="eyebrow">02 / A thoughtful gift</span><h3>Leave room for choice.</h3><p>Explore a discovery set before choosing someone else’s signature scent.</p><button class="link" data-action="samples">See the sample set →</button></div><div class="path"><span class="eyebrow">03 / Into the details</span><h3>Follow your nose.</h3><p>Compare note profiles, save discoveries, and find your next direction.</p><button class="link" data-action="library">Open the scent library →</button></div></div></section>${collection('A few places to start.')}${footer()}`}
function filtered(){return products.filter(p=>(state.library!=='Saved'||state.saved.includes(p.id))&&(state.filter==='All'||p.mood===state.filter)&&(state.budget==='All'||p.price<=Number(state.budget))&&(!state.query||`${p.name} ${p.family} ${p.notes}`.toLowerCase().includes(state.query.toLowerCase())))}
function rows(){const ps=filtered();return `<p class="count">${ps.length} fragrance${ps.length===1?'':'s'} · Illustrative EnveeSage collection</p>${ps.length?ps.map(p=>`<article class="row"><div class="mini">${bottle(p)}</div><div><h3>${p.name}</h3><p>${p.family} · EDP · 50 ml</p></div><div class="notes"><p>${p.notes}</p><p style="margin-top:7px">${p.wear}</p></div><div class="price">${money(p.price)}<p>2 ml / ${money(p.sample)}</p></div><button data-action="product" data-id="${p.id}">View scent ↗</button></article>`).join(''):'<p class="empty">No scents match yet. Try another filter or save a fragrance.</p>'}`}
function library(){return `<div class="library fade">${header()}<div class="libshell"><aside class="sidebar"><div class="eyebrow">Your scent space</div>${['Browse','Saved','Compare'].map(x=>`<button data-library="${x}" class="${state.library===x?'active':''}">${x}${x==='Saved'?' / '+state.saved.length:''}</button>`).join('')}<button data-action="learn">Scent glossary</button><p>Explore at your own depth.<br>Notes describe a scent.<br>Ingredients describe its formula.</p></aside><section class="workspace"><div class="workspace-head"><div><div class="eyebrow">EnveeSage / The scent library</div><h1>${state.library==='Saved'?'Your saved discoveries.':'Find your next direction.'}</h1><p class="muted">A closer look at the fragrances that interest you.</p></div><button class="primary" data-action="samples">Build a sample set ↗</button></div><div class="filters"><input id="search" aria-label="Search fragrance or notes" placeholder="Search fragrance, cedar, citrus…" value="${esc(state.query)}"><select id="family" aria-label="Scent family">${['All','Fresh','Woody','Warm'].map(x=>`<option ${state.filter===x?'selected':''}>${x}</option>`).join('')}</select><select id="budget" aria-label="Maximum bottle price"><option value="All">Any budget</option>${[50000,75000,100000].map(x=>`<option value="${x}" ${state.budget===String(x)?'selected':''}>Up to ${money(x)}</option>`).join('')}</select></div><div id="rows">${rows()}</div><div class="inspector"><div><div class="eyebrow">Make it personal</div><h3>Your nose is the best filter.</h3><p>Open a scent to save it, compare the profiles, or add a sample. Wear descriptions are illustrative and experiences vary.</p></div><div><div class="eyebrow">Know what you’re buying</div><h3>Look beyond the note list.</h3><p>Product detail separates notes, ingredient information and supplier provenance. Verification status needs supporting documents.</p></div></div></section></div>${footer()}</div>`}
function render(){document.getElementById('app').innerHTML=({A:editorial,B:guided,C:library,D:swipe,E:chatv,F:mapv})[state.variant]()+`<div class="note">Design prototype: scents, prices, stock and delivery figures are fictional. Hero image is AI-generated mood photography, not an actual stocked product. No orders or payments are processed.</div><div class="statebox"><details><summary>Prototype state & design question</summary><p>Which structure helps first-time buyers and enthusiasts choose confidently? Round one: boutique, guided studio, library. Round two: swipe deck, concierge chat, scent map.</p><pre id="state"></pre></details></div>`;document.getElementById('variant-select').value=state.variant;const cl=document.getElementById('chatlog');if(cl)cl.scrollTop=cl.scrollHeight;updateState()}
function updateState(){const el=document.getElementById('state');if(el)el.textContent=JSON.stringify(state,null,2);console.log('Prototype state',JSON.stringify(state))}
function switchVariant(v){close();state.variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);render();window.scrollTo(0,0)}function cycle(n){switchVariant(keys[(keys.indexOf(state.variant)+n+keys.length)%keys.length])}
function toast(msg){document.getElementById('toast').innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',3500)}
let opener;function drawer(title,body){opener=document.activeElement;document.getElementById("app").inert=true;document.querySelector(".switcher").inert=true;document.getElementById('modal').innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawerhead"><span class="eyebrow">EnveeSage / ${esc(title)}</span><button data-action="close" aria-label="Close dialog">×</button></div>${body}</section></div>`;document.body.style.overflow='hidden';document.querySelector('[data-action="close"]').focus()}
function close(){document.getElementById('app').inert=false;document.querySelector('.switcher').inert=false;document.getElementById('modal').innerHTML='';document.body.style.overflow='';if(opener?.isConnected)opener.focus()}
function detail(id){const p=byid(id);drawer('Scent detail',`<div class="art" style="background:${p.color}">${bottle(p)}</div><div class="eyebrow">${p.family} / Eau de parfum</div><h2 style="margin-top:12px">${p.name}</h2><p>${p.description}</p><h3>Choose your size</h3><button class="primary" data-action="add" data-id="${id}" data-size="sample">Add 2 ml sample · ${money(p.sample)} →</button><button class="secondary" data-action="add" data-id="${id}" data-size="bottle">Add 50 ml bottle · ${money(p.price)}</button><div style="display:flex;gap:25px"><button class="link" data-action="save" data-id="${id}">${state.saved.includes(id)?'♥ Saved':'♡ Save scent'}</button><button class="link" data-action="compare" data-id="${id}">Compare profile +</button></div><details open><summary>What does it smell like?</summary><p>${p.notes}. ${p.wear}. Scent descriptions are not ingredients or a guaranteed wear time.</p></details><details><summary>Ingredients & sensitivity</summary><p>Demo product: ingredient list is unavailable. Live products need supplied ingredient labels and warnings. Do not infer allergens or safety from scent notes. No fragrance can be assumed suitable for everyone.</p></details><details><summary>Source & product registration</summary><p>Illustrative product. Supplier, origin, batch information, registration records and provenance documents are not provided. No authenticity or regulatory verification is claimed.</p></details><p class="muted">Sample packaging and labeling need validation before launch.</p>`)}
function samples(){drawer('Discovery set',`<h2>Three scents.<br>Your own pace.</h2><p>A 2 ml sample of each fragrance. Explore fresh, woody and warm profiles before choosing a bottle.</p>${products.map(p=>`<div class="lineitem"><span>${p.name}<br><span class="muted">${p.family} · 2 ml</span></span><span>${money(p.sample)}</span></div>`).join('')}<button class="primary" data-action="addset">Add all three · ₦10,500 →</button><p class="muted">Illustrative samples. No redemption credit is assumed. Decanting, labeling and carrier acceptance must be validated before launch.</p>`)}
function subtotal(){return state.cart.reduce((s,i)=>s+(i.size==='sample'?byid(i.id).sample:byid(i.id).price),0)}
function totals(){const n=subtotal(),fee=state.delivery==='Lagos'?3500:state.delivery==='Abuja (FCT)'?5000:state.delivery==='Rivers'?6000:7500;return `<div class="lineitem"><span>Products</span><span>${money(n)}</span></div><div class="lineitem"><span>Illustrative delivery<br><span class="muted">${state.delivery==='Lagos'?'2–4':'4–7'} working days</span></span><span>${money(n?fee:0)}</span></div><div class="lineitem"><strong>Total to review</strong><strong>${money(n?n+fee:0)}</strong></div>`}
function bag(){drawer('Your bag',`<h2>Your next discoveries.</h2>${state.cart.length?state.cart.map((i,x)=>{const p=byid(i.id);return `<div class="lineitem"><span>${p.name}<br><span class="muted">${i.size==='sample'?'2 ml sample':'50 ml bottle'}</span><br><button class="link" data-remove="${x}">Remove</button></span><span>${money(i.size==='sample'?p.sample:p.price)}</span></div>`}).join(''):'<p>Your bag is empty. Start with a sample.</p>'}<h3>Delivery destination</h3><label for="delivery">Choose your state</label><select id="delivery">${['Lagos','Abuja (FCT)','Rivers','Other states'].map(x=>`<option ${state.delivery===x?'selected':''}>${x}</option>`).join('')}</select><div id="totals">${totals()}</div>${state.cart.length?'<button class="primary" data-action="checkout">Preview payment step →</button>':'<button class="primary" data-action="samples">Explore samples →</button>'}<p class="muted">Delivery charges and dates are placeholders, not courier quotes.</p>`)}
function comparison(){drawer('Compare scents',`<h2>Follow the differences.</h2><p>Choose “Compare profile” inside a scent to add it here.</p>${state.compare.length?state.compare.map(id=>{const p=byid(id);return `<div class="lineitem"><div><h3 style="margin:0 0 10px">${p.name}</h3><p>${p.notes}<br>${p.wear}<br>${money(p.price)} / sample ${money(p.sample)}</p><button class="link" data-action="product" data-id="${id}">View scent →</button></div><button class="link" data-uncompare="${id}">Remove</button></div>`}).join(''):'<p class="empty">No scents selected yet.</p>'}<p class="muted">Profiles are illustrative. Concentration and notes alone cannot predict longevity.</p>`)}
function deliveryInfo(){drawer('Delivery information',`<h2>Where is your scent headed?</h2><p>Nigeria-first delivery. The demo includes Lagos, FCT, Rivers and other states, with illustrative fees and windows.</p><h3>Before a real order</h3><p>Show an area-based courier quote, final charges, stock availability, dispatch estimate, and terms for failed delivery before payment.</p><h3>Careful handling</h3><p>Carrier acceptance, packaging and delivery zones need confirmation with the actual courier, especially for alcohol-based products.</p>`)}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const id=Number(t.dataset.id);if(t.dataset.choice){state.answers[questions[state.quizStep].key]=t.dataset.choice;document.getElementById('quiz').innerHTML=quiz();updateState();return}if(t.dataset.library){if(t.dataset.library==='Compare')comparison();else{state.library=t.dataset.library;render()}return}if(t.dataset.remove!==undefined){state.cart.splice(Number(t.dataset.remove),1);render();bag();return}if(t.dataset.uncompare){state.compare=state.compare.filter(x=>x!==Number(t.dataset.uncompare));comparison();updateState();return}switch(t.dataset.action){case'close':close();break;case'finder':switchVariant('B');break;case'library':switchVariant('C');break;case'browse':if(state.variant==='C'){state.library='Browse';render()}else document.getElementById('collection')?.scrollIntoView({behavior:'smooth'});break;case'product':detail(id);break;case'samples':samples();break;case'save':{const open=!!document.querySelector('.overlay');state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];render();if(open)detail(id);toast(state.saved.includes(id)?'Saved to your discoveries.':'Removed from saved discoveries.');break}case'saved':state.library='Saved';switchVariant('C');break;case'compare':if(!state.compare.includes(id))state.compare.push(id);comparison();updateState();break;case'add':state.cart.push({id,size:t.dataset.size});render();bag();toast('Added to your demo bag.');break;case'addset':products.forEach(p=>state.cart.push({id:p.id,size:'sample'}));render();bag();break;case'bag':bag();break;case'delivery':deliveryInfo();break;case'checkout':drawer('Payment preview',`<h2>Ready when you are.</h2><p>This is the end of the prototype checkout. A live checkout will confirm contact details, address, fees and return terms before payment.</p><h3>Payment options to validate</h3><p>Card and bank transfer through a Nigerian provider. An initiated transfer remains pending until server-side payment verification.</p><button class="primary" data-action="bag">Back to my bag →</button><p class="muted">No payment is taken and no order is placed.</p>`);break;case'learn':drawer('Scent notes',`<h2>A little scent vocabulary.</h2><h3>Notes</h3><p>A vocabulary for how a perfume smells. “Amber” can describe an accord rather than a single ingredient.</p><h3>Eau de parfum</h3><p>A product concentration description. It does not, by itself, promise how long a fragrance will last.</p><h3>Projection</h3><p>How far a scent seems to travel from your skin. It varies by person, setting and application.</p><h3>Sampling</h3><p>Trying a small amount helps you discover your own preference. A scent suggestion is a starting point.</p>`);break;case'quiznext':if(!state.answers[questions[state.quizStep].key]){toast('Choose an option to continue.');return}state.quizStep++;document.getElementById('quiz').innerHTML=quiz();updateState();break;case'quizback':if(state.quizStep){state.quizStep--;document.getElementById('quiz').innerHTML=quiz();updateState()}else document.getElementById('collection').scrollIntoView({behavior:'smooth'});break;case'resetquiz':state.quizStep=0;state.answers={};document.getElementById('quiz').innerHTML=quiz();updateState();break;}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;document.getElementById('rows').innerHTML=rows();updateState()}});document.addEventListener('change',e=>{if(e.target.id==='family'||e.target.id==='budget'){state[e.target.id==='family'?'filter':'budget']=e.target.value;document.getElementById('rows').innerHTML=rows();updateState()}if(e.target.id==='delivery'){state.delivery=e.target.value;document.getElementById('totals').innerHTML=totals();updateState()}});

const more=[{id:4,name:'Lagos Rain',family:'Green fresh',notes:'Green tea · vetiver · rain accord',mood:'Fresh',price:45000,sample:3000,color:'#cfe3d3',description:'Wet green leaves and cool vetiver. Like the city exhaling after a downpour.',wear:'Light to moderate',feels:'The first breath after a Lagos downpour',x:24,y:42},{id:5,name:'Oud Majlis',family:'Oud & spice',notes:'Oud accord · rose · saffron',mood:'Warm',price:120000,sample:6000,color:'#c9a48a',description:'Smoky oud accord softened by rose and saffron. Deep, rich and made for occasions.',wear:'Strong presence',feels:'Agbada, gold trim, a room that turns',x:84,y:78},{id:6,name:'Velvet Hibiscus',family:'Fruity floral',notes:'Hibiscus · pink pepper · musk',mood:'Floral',price:54000,sample:3500,color:'#ecc3c8',description:'Tart hibiscus and a pinch of pepper over soft musk. Playful and bright.',wear:'Moderate presence',feels:'Zobo on ice at a sunset rooftop',x:44,y:28}];
Object.assign(products[0],{feels:'Freshly ironed white linen on a bright morning',x:15,y:32});Object.assign(products[1],{feels:'A quiet library with the windows open',x:55,y:52});Object.assign(products[2],{feels:'Candlelight, late dinner, slow conversation',x:78,y:68});
const catalog=[...products,...more];
const sum=ids=>ids.reduce((s,id)=>s+byid(id).sample,0);
Object.assign(state,{deck:{i:0,liked:[],passed:[]},chat:{msgs:[],profile:{},typing:false},map:{x:null,y:null,family:'All',sel:null}});

// D — The Scent Swipe: one card at a time, keeps fill a five-vial box.
function swipe(){return `<div class="swipe-v fade">${header()}<section class="swipe" id="swipe">${swipeInner()}</section>${footer()}</div>`}
function swipeInner(){const d=state.deck,p=catalog[d.i];return `<div class="swipe-intro"><div class="eyebrow">Discover by instinct</div><h1>Swipe your<br>way to a<br><em>signature.</em></h1><p>No notes, no jargon. Keep what intrigues you, skip what doesn’t. Your keeps fill a sample box.</p><p class="swipe-hint">${p?`Scent ${d.i+1} of ${catalog.length} · drag the card or use the buttons`:'You have seen every scent'}</p></div><div class="deck-wrap">${p?deckCard(p)+`<div class="deck-actions"><button class="round" data-action="undo" aria-label="Undo last choice" ${d.i?'':'disabled'}>↺</button><button class="round big pass" data-action="pass" aria-label="Skip ${p.name}">✕</button><button class="round big keep" data-action="keep" aria-label="Keep ${p.name} for my sample box">♥</button><button class="round" data-action="product" data-id="${p.id}" aria-label="More about ${p.name}">i</button></div>`:deckDone()}</div><aside class="tray" aria-label="Your sample box"><div class="eyebrow">Your sample box</div><div class="vials">${[0,1,2,3,4].map(n=>{const q=d.liked[n]&&byid(d.liked[n]);return `<div class="vial ${q?'full':''}" ${q?`style="--c:${q.color}"`:''}>${q?`<span>${q.name.split(' ')[0]}</span>`:''}</div>`}).join('')}</div><p>${d.liked.length}/5 vials · ${money(sum(d.liked))} in 2 ml samples</p><button class="primary" data-action="boxtobag" ${d.liked.length?'':'disabled'}>Add box to bag →</button></aside>`}
function deckCard(p){const next=catalog[state.deck.i+1];return `<div class="deck">${next?`<div class="card under" style="--c:${next.color}" aria-hidden="true"></div>`:''}<article class="card" id="card" style="--c:${p.color}"><div class="card-art">${bottle(p)}</div><div class="card-body"><div class="eyebrow">${p.family}</div><h2>${p.name}</h2><p class="feels">“${p.feels}”</p><div class="pills">${p.notes.split(' · ').map(n=>`<span>${n}</span>`).join('')}</div><p class="muted">${money(p.sample)} sample · ${money(p.price)} bottle</p></div><div class="stamp keep-stamp">KEEP</div><div class="stamp pass-stamp">SKIP</div></article></div>`}
function deckDone(){const d=state.deck;return `<div class="done"><div class="eyebrow">Round complete</div><h2>${d.liked.length?`You kept ${d.liked.length}.`:d.boxed?'Your box is in the bag.':'Nothing clicked?'}</h2>${d.liked.length?d.liked.map(id=>`<div class="lineitem"><span>${byid(id).name}<br><span class="muted">${byid(id).family}</span></span><span>${money(byid(id).sample)}</span></div>`).join(''):d.boxed?'<p class="muted">Open your bag to review it, or swipe again.</p>':'<p class="muted">That is useful too. Try the scent map or concierge for a different route in.</p>'}${d.liked.length?'<button class="primary" data-action="boxtobag">Add box to bag →</button>':''}<button class="link" data-action="restartdeck">Swipe again</button></div>`}
function decide(keep){const d=state.deck,p=catalog[d.i];if(!p)return;if(keep){if(d.liked.length>=5){toast('Your box holds five vials. Skip or review it.');return}d.liked.push(p.id)}else d.passed.push(p.id);d.i++;document.getElementById('swipe').innerHTML=swipeInner();updateState()}
let drag=null;document.addEventListener('pointerdown',e=>{const c=e.target.closest('#card');if(!c)return;drag={c,x:e.clientX,dx:0};c.classList.add('dragging');c.setPointerCapture(e.pointerId)});document.addEventListener('pointermove',e=>{if(!drag)return;drag.dx=e.clientX-drag.x;drag.c.style.transform=`translateX(${drag.dx}px) rotate(${drag.dx/18}deg)`;drag.c.querySelector('.keep-stamp').style.opacity=Math.max(0,drag.dx/90);drag.c.querySelector('.pass-stamp').style.opacity=Math.max(0,-drag.dx/90)});document.addEventListener('pointerup',()=>{if(!drag)return;const{c,dx}=drag;drag=null;c.classList.remove('dragging');if(Math.abs(dx)>90){c.classList.add('settle');c.style.transform=`translateX(${dx>0?600:-600}px) rotate(${dx/8}deg)`;setTimeout(()=>decide(dx>0),220)}else{c.classList.add('settle');c.style.transform='';c.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0);setTimeout(()=>c.classList.remove('settle'),300)}});

// E — The Concierge Chat: conversational shopping, WhatsApp-style, with what the bot "knows" made visible.
const opening={from:'bot',text:'Hi, I’m Sage from EnveeSage 👋 I’ll help you find a scent you’ll love. What are you shopping for today?',replies:['My first perfume','A gift for someone','Something for owambe','I know what I like']};
function chatv(){if(!state.chat.msgs.length)state.chat.msgs=[opening];return `<div class="chat-v fade">${header()}<section class="chatshell"><div class="chatwin"><div class="chathead"><div class="avatar">S</div><div><b>Sage · EnveeSage concierge</b><small>Prototype assistant · replies are scripted</small></div></div><div class="chatlog" id="chatlog" aria-live="polite">${chatLog()}</div><form class="chatform" id="chatform"><input id="chatinput" autocomplete="off" aria-label="Message Sage" placeholder="Try “oud under 100k” or “delivery to Abuja”"><button aria-label="Send">➤</button></form></div><aside class="knows" id="knows">${knows()}</aside></section>${footer()}</div>`}
function chatLog(){const m=state.chat.msgs;return m.map((x,i)=>`<div class="msg ${x.from}">${esc(x.text)}${(x.products||[]).map(id=>{const p=byid(id);return `<div class="pcard"><div class="mini" style="background:${p.color}">${bottle(p)}</div><div><strong>${p.name}</strong><small>${p.notes}</small><small>${money(p.sample)} sample · ${money(p.price)} / 50 ml</small></div><div class="pcard-actions"><button class="fill" data-action="chatadd" data-id="${p.id}">Add sample</button><button data-action="product" data-id="${p.id}">Details</button></div></div>`}).join('')}</div>${i===m.length-1&&x.replies&&!state.chat.typing?`<div class="replies">${x.replies.map(r=>`<button data-reply="${esc(r)}">${esc(r)}</button>`).join('')}</div>`:''}`).join('')+(state.chat.typing?'<div class="msg bot typing">Sage is typing…</div>':'')}
function knows(){const p=state.chat.profile,row=(k,label,v)=>v?`<div class="chip"><span>${label}: <b>${esc(v)}</b></span><button data-forget="${k}">Forget</button></div>`:`<div class="chip empty"><span>${label}: not shared yet</span></div>`;return `<div class="eyebrow">Transparent by design</div><h2>What Sage knows so far.</h2><p>Only what you said in this chat. Remove anything and the suggestions change.</p><div class="chips">${row('purpose','Shopping for',p.purpose)}${row('mood','Scent feeling',p.mood)}${row('budget','Bottle budget',p.budget&&('Up to '+money(p.budget)))}${row('occasion','Occasion',p.occasion)}${p.loves?row('loves','Loves',p.loves):''}</div><div class="handoff"><div class="eyebrow">Prefer a person?</div><p>A real version could hand over to a named EnveeSage stylist on WhatsApp, with your consent to share this summary.</p><button class="secondary" data-action="whatsapp">Continue on WhatsApp</button><p>Prototype: no chat is stored or sent. A live version needs NDPA-compliant consent and retention rules.</p></div>`}
function parse(t){const s=t.toLowerCase(),p=state.chat.profile,r={};if(/first|new to|beginner/.test(s))p.purpose='Myself (first perfume)';if(/gift|for (my|her|him|someone)|present/.test(s)){p.purpose='A gift';r.gift=1}if(/owambe|wedding|party|event|evening|night|date/.test(s))p.occasion='Owambe & evenings';else if(/work|office/.test(s))p.occasion='Work';else if(/every ?day|daily/.test(s))p.occasion='Everyday';if(/oud|smok|saffron/.test(s)){p.mood='Warm';p.loves='Oud'}else if(/fresh|citrus|clean|light|green|rain/.test(s))p.mood='Fresh';else if(/wood|cedar|vetiver/.test(s))p.mood='Woody';else if(/warm|amber|vanilla|sweet|rich|bold|strong/.test(s))p.mood='Warm';else if(/floral|flower|rose|hibiscus|fruity/.test(s))p.mood='Floral';const n=s.replace(/,/g,'').match(/(\d+(?:\.\d+)?)\s*(k|000)?/);if(n&&/\d{2,}|k/.test(n[0])){let v=parseFloat(n[1]);if(n[2]==='k')v*=1000;if(v<1000)v*=1000;if(v>=20000)p.budget=v}if(/know what i like/.test(s))r.notes=1;if(/deliver|ship|abuja|lagos|port harcourt|rivers/.test(s))r.delivery=1;if(/sample|how.*work/.test(s))r.samples=1;if(/different|else|another/.test(s))r.different=1;if(/discovery set|all three/.test(s))r.set=1;if(/start over|restart/.test(s))r.restart=1;if(/human|person|whatsapp|agent/.test(s))r.human=1;return r}
function botReply(r){const p=state.chat.profile;if(r.restart){state.chat.profile={};return opening}if(r.human)return{from:'bot',text:'I can hand you to a stylist on WhatsApp. In the real app I’d ask your permission first, then share only the summary on the right. (Prototype: nothing is sent.)',replies:['Keep chatting with Sage','Start over']};if(r.delivery)return{from:'bot',text:'We deliver across Nigeria. Demo estimates: Lagos ₦3,500 (2–4 working days), Abuja ₦5,000, Rivers ₦6,000, other states ₦7,500 (4–7 days). You’ll see the final courier quote before paying.',replies:p.mood?['Show my suggestions','How do samples work?']:['Help me choose a scent','How do samples work?']};if(r.samples)return{from:'bot',text:'Each sample is a 2 ml vial, about 30 sprays. Wear it for a few days and see how it feels on your skin before buying a bottle.',replies:['Help me choose a scent','Add the discovery set']};if(r.set){[1,2,3].forEach(id=>state.cart.push({id,size:'sample'}));return{from:'bot',text:'Added the three-scent discovery set (₦10,500) to your bag. Anything else?',replies:['How does delivery work?','Show me something different']}}if(r.notes)return{from:'bot',text:'Love that. Tell me notes or styles you enjoy, and a budget if you have one. For example “oud under 120k” or “fresh citrus, 50k”.',replies:['Oud','Fresh citrus','Vanilla & amber','Floral']};if(r.gift&&!p.mood)return{from:'bot',text:'Lovely. If you’re unsure of their taste, a discovery set lets them choose. Or describe them and I’ll suggest a bottle.',replies:['Add the discovery set','They love bold scents','They like fresh & clean']};if(!p.mood)return{from:'bot',text:'What kind of scent feels like you? Go with your gut.',replies:['Fresh & clean','Woody','Warm & sweet','Oud','Floral']};if(!p.budget)return{from:'bot',text:`${p.loves||p.mood}, noted. Roughly what would you spend on a full bottle?`,replies:['Under ₦50k','Around ₦75k','Up to ₦120k','Just samples for now']};const cap=p.budget,pool=catalog.filter(x=>x.price<=cap),pick=(r.different?pool.filter(x=>x.mood!==p.mood):pool.filter(x=>x.mood===p.mood)).sort((a,b)=>p.loves==='Oud'?b.price-a.price:a.price-b.price).slice(0,2),list=pick.length?pick:pool.slice(0,2);return{from:'bot',text:list.length?`${r.different?'Something different':'Here’s where I’d start'}${p.occasion?' for '+p.occasion.toLowerCase():''}. Try a sample first, your skin decides:`:'Nothing fits that budget yet. Samples start at ₦2,500 though!',products:list.map(x=>x.id),replies:['Show me something different','How does delivery work?','Talk to a human','Start over']}}
function send(text){if(!text.trim()||state.chat.typing)return;if(/^just samples/i.test(text))state.chat.profile.budget=120000;state.chat.msgs.push({from:'me',text});const r=parse(text);state.chat.typing=true;paintChat();setTimeout(()=>{state.chat.typing=false;const m=botReply(r);if(m===opening)state.chat.msgs.push({...opening,text:'Fresh start. What are you shopping for today?'});else state.chat.msgs.push(m);if(r.set)render();else paintChat()},matchMedia('(prefers-reduced-motion: reduce)').matches?0:650)}
function paintChat(){const l=document.getElementById('chatlog');if(!l)return;l.innerHTML=chatLog();document.getElementById('knows').innerHTML=knows();l.scrollTop=l.scrollHeight;updateState()}

// F — The Scent Map: tap where you want to be; nearest scents rank themselves.
function mapv(){const m=state.map;return `<div class="map-v fade">${header()}<section class="maphead"><div><div class="eyebrow">Explore by feel, not by name</div><h1>Put a pin in<br>your <em>mood.</em></h1></div><p>Every scent sits somewhere between fresh and warm, soft and bold. Tap the map where you want to be and we rank the closest matches.</p></section><div class="famchips" role="group" aria-label="Filter by family">${['All','Fresh','Woody','Warm','Floral'].map(f=>`<button data-fam="${f}" aria-pressed="${m.family===f}">${f}</button>`).join('')}</div><section class="mapgrid"><div class="mapbox"><div class="yaxis"><span>Soft</span><span>Bold</span></div><div class="map-surface" id="mapview" role="application" aria-label="Scent map. Use the sliders below for keyboard control.">${mapInner()}</div><div class="axis"><span>← Fresh</span><span>Warm →</span></div><div class="sliders"><div><label for="mapx">Fresh ↔ Warm</label><input type="range" id="mapx" min="0" max="100" value="${m.x??50}"></div><div><label for="mapy">Soft ↔ Bold</label><input type="range" id="mapy" min="0" max="100" value="${m.y??50}"></div></div></div><div class="maplist" id="maplist">${mapList()}</div></section>${footer()}</div>`}
function mapInner(){const m=state.map;return `<span class="quad tl">Crisp &<br>energising</span><span class="quad tr">Rich &<br>magnetic</span><span class="quad bl">Clean &<br>easy</span><span class="quad br">Cosy &<br>close</span>${catalog.map(p=>`<button class="dot ${m.sel===p.id?'sel':''} ${m.family!=='All'&&p.mood!==m.family?'dim':''}" data-dot="${p.id}" style="left:${p.x}%;top:${100-p.y}%;--c:${p.color}" aria-label="${p.name}, ${p.family}"><i></i><span>${p.name}</span></button>`).join('')}${m.x===null?'<div class="mapempty">Tap anywhere to drop your pin</div>':`<div class="pin" style="left:${m.x}%;top:${100-m.y}%"><b></b><small>YOU</small></div>`}`}
function mapList(){const m=state.map,pool=catalog.filter(p=>m.family==='All'||p.mood===m.family);if(m.x===null)return `<div class="eyebrow">Closest to you</div><h2>Where should we start?</h2><p>Drop a pin on the map, or tap a scent to read about it. Positions are illustrative curation, not lab measurements.</p>${pool.map(row=>nearRow(row,null)).join('')}`;const ranked=pool.map(p=>({p,d:Math.hypot(p.x-m.x,p.y-m.y)})).sort((a,b)=>a.d-b.d);return `<div class="eyebrow">Closest to your pin</div><h2>${ranked[0]?ranked[0].p.name+' is nearest.':'No scents here.'}</h2><p>${quadName(m.x,m.y)} territory. Closeness is distance on our curated map; your skin may disagree.</p>${ranked.map(r=>nearRow(r.p,Math.max(0,Math.round(100-r.d*1.1)))).join('')}`}
function nearRow(p,c){return `<div class="near ${state.map.sel===p.id?'sel':''}"><div class="sw" style="--c:${p.color}"></div><div><h3>${p.name}</h3><p>${p.family} · ${p.notes}</p>${c===null?'':`<div class="bar" aria-label="${c}% close"><i style="width:${c}%"></i></div>`}</div><div class="near-side">${c===null?money(p.sample):c+'% close'}<button data-action="product" data-id="${p.id}">Try ${money(p.sample)} sample</button></div></div>`}
function quadName(x,y){return y>=50?(x<50?'Crisp & energising':'Rich & magnetic'):(x<50?'Clean & easy':'Cosy & close')}
function paintMap(){document.getElementById('mapview').innerHTML=mapInner();document.getElementById('maplist').innerHTML=mapList();updateState()}

// Second-round wiring
document.addEventListener('click',e=>{const dot=e.target.closest('[data-dot]');if(dot){state.map.sel=Number(dot.dataset.dot);paintMap();return}const surf=e.target.closest('.map-surface');if(surf){const b=surf.getBoundingClientRect();state.map.x=Math.round((e.clientX-b.left)/b.width*100);state.map.y=Math.round(100-(e.clientY-b.top)/b.height*100);document.getElementById('mapx').value=state.map.x;document.getElementById('mapy').value=state.map.y;paintMap();return}const t=e.target.closest('button');if(!t)return;if(t.dataset.fam){state.map.family=t.dataset.fam;document.querySelectorAll('[data-fam]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.fam===t.dataset.fam));paintMap();return}if(t.dataset.reply){send(t.dataset.reply);return}if(t.dataset.forget){delete state.chat.profile[t.dataset.forget];paintChat();return}const id=Number(t.dataset.id);switch(t.dataset.action){case'keep':decide(true);break;case'pass':decide(false);break;case'undo':{const d=state.deck;if(!d.i)break;d.i--;const pid=catalog[d.i].id;d.liked=d.liked.filter(x=>x!==pid);d.passed=d.passed.filter(x=>x!==pid);document.getElementById('swipe').innerHTML=swipeInner();updateState();break}case'restartdeck':state.deck={i:0,liked:[],passed:[]};document.getElementById('swipe').innerHTML=swipeInner();updateState();break;case'boxtobag':state.deck.liked.forEach(id=>state.cart.push({id,size:'sample'}));state.deck.liked=[];state.deck.boxed=true;render();bag();toast('Sample box added to your demo bag.');break;case'chatadd':state.cart.push({id,size:'sample'});render();toast(`${byid(id).name} sample added to your demo bag.`);break;case'whatsapp':toast('Prototype: WhatsApp hand-off is not connected.');break}});
document.addEventListener('submit',e=>{if(e.target.id!=='chatform')return;e.preventDefault();const i=document.getElementById('chatinput');send(i.value);i.value=''});
document.addEventListener('input',e=>{if(e.target.id==='mapx'||e.target.id==='mapy'){state.map.x=Number(document.getElementById('mapx').value);state.map.y=Number(document.getElementById('mapy').value);paintMap()}});document.addEventListener('change',e=>{if(e.target.id==='variant-select')switchVariant(e.target.value)});

document.getElementById('variant-select').innerHTML=keys.map(k=>`<option value="${k}">${k} / ${names[k]}</option>`).join('');document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{const dialog=document.querySelector('.drawer');if(dialog){if(e.key==='Escape')close();if(e.key==='Tab'){const els=[...dialog.querySelectorAll('button,a,input,select,summary')].filter(x=>x.getClientRects().length),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}});render();
</script></body></html>
