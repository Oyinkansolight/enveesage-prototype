</style></head><body><main id="app"></main><div id="modal"></div><div id="toast" role="status" aria-live="polite"></div><div class="switcher" aria-label="Prototype variant switcher"><button id="prev" aria-label="Previous design">←</button><div class="variant-label"><small>THROWAWAY PROTOTYPE · 3 DIRECTIONS</small><span id="variant-label"></span></div><button id="next" aria-label="Next design">→</button></div><script>
const products=[{id:1,name:'Citrus Daybreak',family:'Fresh citrus',notes:'Bergamot · neroli · soft musk',mood:'Fresh',price:38000,sample:2500,color:'#e5e2cb',description:'Bright citrus gives way to soft, clean musk. An easy starting point if you enjoy fresh scents.',wear:'Light, close to the skin'},{id:2,name:'Quiet Woods',family:'Woody aromatic',notes:'Cedar · cardamom · vetiver',mood:'Woody',price:62000,sample:3500,color:'#d4d8c6',description:'Dry woods and gentle spice, with a green finish. For days when you want something quietly distinctive.',wear:'Moderate presence'},{id:3,name:'Amber After Hours',family:'Warm amber',notes:'Amber accord · vanilla · sandalwood',mood:'Warm',price:85000,sample:4500,color:'#e4c9b5',description:'A smooth amber accord with vanilla warmth and a woody finish. Richer and more enveloping.',wear:'Fuller presence'}];
const names={A:'The Editorial Boutique',B:'The Guided Studio',C:'The Scent Library'},keys=['A','B','C'];const requested=new URLSearchParams(location.search).get('variant');const state={variant:keys.includes(requested)?requested:'A',cart:[],saved:[],compare:[],quizStep:0,answers:{},filter:'All',budget:'All',query:'',library:'Browse',delivery:'Lagos'};
const money=n=>'₦'+n.toLocaleString('en-NG'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const byid=id=>products.find(p=>p.id===id);
function bottle(p){return `<div class="bottle" aria-hidden="true"><div class="bottle-label">${p.name.split(' ')[0]}<small>CONCEPT · 50 ML</small></div></div>`}
function header(){return `<header><a class="brand" href="?variant=${state.variant}">Envee<em>Sage</em></a><nav aria-label="Main navigation"><button data-action="browse">Discover</button><button data-action="samples">Samples</button><button data-action="learn">Scent notes</button></nav><div class="tools"><button class="link" data-action="saved">Saved (${state.saved.length})</button><button class="bag" data-action="bag">Bag (${state.cart.length})</button></div></header>`}
function product(p){return `<article class="product"><div class="art" style="background:${p.color}">${bottle(p)}<button class="save" data-action="save" data-id="${p.id}" aria-label="Save ${p.name}" aria-pressed="${state.saved.includes(p.id)}">${state.saved.includes(p.id)?'♥':'♡'}</button></div><div class="product-info"><div class="eyebrow">${p.family} / Eau de parfum</div><h3>${p.name}</h3><p>${p.notes}</p><div class="product-bottom"><span>${money(p.price)} <span class="muted">/ 50 ml</span></span><button class="link" data-action="product" data-id="${p.id}">Explore →</button></div></div></article>`}
function collection(title='Your next scent, thoughtfully chosen.'){return `<section class="section" id="collection"><div class="section-head"><div><div class="eyebrow">The EnveeSage edit</div><h2>${title}</h2></div><button class="link" data-action="samples">Try the discovery set ↗</button></div><div class="products">${products.map(product).join('')}</div></section>`}
function footer(){return `<footer><span class="brand">Envee<em>Sage</em></span><span>Nigeria · Curated perfume & samples</span><button class="link" data-action="delivery">Delivery information →</button></footer>`}
function editorial(){return `<div class="topline">A Nigerian perfume destination · Discover through samples</div>${header()}<section class="hero fade"><img src="assets/editorial-hero.jpg" alt="Concept photograph of an unbranded perfume bottle and sample vial in warm light"><div class="hero-copy"><div class="eyebrow">A little discovery. A lasting impression.</div><h1>A scent that<br>feels like <em>you.</em></h1><p>From your first perfume to your next obsession. Discover beautiful fragrances, one sample at a time.</p><button class="primary" data-action="finder">Find my fragrance ↗</button><p style="font-size:11px;margin:18px 0 0">No scent vocabulary needed.</p></div><div class="hero-note">01 / Curated for discovery<br><span class="muted">Sample first. Let your skin decide.</span></div></section><div class="underhero"><span>◇ Prices in Nigerian naira</span><span>◇ 2 ml samples & full bottles</span><span>◇ Delivery estimates by state</span></div>${collection()}<section class="story"><div><div class="eyebrow">Small bottle. Better decision.</div><h2>Meet your perfume<br>before you commit.</h2><p>A note list can only tell you so much. Wear a sample, live with it, and see how it feels on your skin.</p><button class="link" data-action="samples">Build a sample wardrobe →</button></div><div class="steps"><p><span>01</span>Choose a few scents that catch your curiosity.</p><p><span>02</span>Try them on different days, at your own pace.</p><p><span>03</span>Come back for the bottle you love.</p></div></section>${footer()}`}
const questions=[{key:'mood',title:'What feels most like you?',hint:'Go with a feeling. There is no wrong answer.',options:['Fresh','Woody','Warm','Help me explore']},{key:'budget',title:'What is your bottle budget?',hint:'Demo samples start at ₦2,500.',options:['Under ₦50,000','₦50,000–₦75,000','Up to ₦100,000','Just exploring']},{key:'occasion',title:'When will you wear it?',hint:'A starting point, rather than a rule.',options:['Everyday','Work & close spaces','Evenings','A gift']}];
function match(){const cap=state.answers.budget==='Under ₦50,000'?50000:state.answers.budget==='₦50,000–₦75,000'?75000:100000;const eligible=products.filter(p=>p.price<=cap);const preferred=state.answers.mood;const occasionMood=state.answers.occasion==='Evenings'?'Warm':'Fresh';return eligible.find(p=>p.mood===preferred)||eligible.find(p=>p.mood===occasionMood)||eligible[0]}
function quiz(){if(state.quizStep===3&&state.answers.occasion==='A gift'){return `<div class="eyebrow">Your discovery starting point</div><h2>Give them room to discover.</h2><p class="muted">A three-scent sample set lets them explore fresh, woody and warm profiles before committing to a bottle.</p><p style="font-size:12px;margin:20px 0">Suggested because you are buying a gift. This demo set is ₦10,500 before illustrative delivery.</p><button class="primary" data-action="samples">Explore the discovery set →</button><button class="link" data-action="resetquiz">Start again</button>`}if(state.quizStep===3){const p=match();return `<div class="eyebrow">Your discovery starting point</div><div class="progress"><i class="on"></i><i class="on"></i><i class="on"></i></div><h2>${p.name}</h2><p class="muted">${p.description}</p><p style="font-size:12px;margin:20px 0">${p.mood===state.answers.mood?"Matches your chosen scent feeling":"An alternative within your budget"}. We prioritize your scent feeling and budget, then use occasion as a fallback. Your skin experience may differ.</p><button class="primary" data-action="product" data-id="${p.id}">Try a ${money(p.sample)} sample →</button><button class="link" data-action="resetquiz">Start again</button>`}const q=questions[state.quizStep];return `<div class="eyebrow">Your scent finder / 0${state.quizStep+1}</div><div class="progress">${questions.map((_,i)=>`<i class="${i<=state.quizStep?'on':''}"></i>`).join('')}</div><h2>${q.title}</h2><p class="muted" style="font-size:12px">${q.hint}</p><div class="choices">${q.options.map(o=>`<button class="choice ${state.answers[q.key]===o?'selected':''}" data-choice="${esc(o)}" aria-pressed="${state.answers[q.key]===o}">${o}<span>${state.answers[q.key]===o?'●':'○'}</span></button>`).join('')}</div><div class="quiznav"><button class="link" data-action="quizback">${state.quizStep?'← Back':'Skip to browse'}</button><button class="primary" data-action="quiznext">${state.quizStep===2?'See my suggestion':'Continue'} →</button></div>`}
function guided(){return `${header()}<section class="finder fade"><div class="finder-copy"><div class="eyebrow">Good perfume. No guesswork.</div><h1>Your scent<br>story starts<br><em>here.</em></h1><p>Tell us what you like. We’ll give you a starting point to explore, with samples before full bottles.</p><p style="font-size:11px;margin-top:25px">Three questions · No account needed</p></div><div class="quiz" id="quiz">${quiz()}</div></section><section class="section"><div class="section-head"><div><div class="eyebrow">Go your own way</div><h2>However you like to discover.</h2></div></div><div class="paths"><div class="path"><span class="eyebrow">01 / First fragrance</span><h3>Keep it simple.</h3><p>Everyday scents, clear descriptions, and a small sample to get you started.</p><button class="link" data-action="browse">Explore the edit →</button></div><div class="path"><span class="eyebrow">02 / A thoughtful gift</span><h3>Leave room for choice.</h3><p>Explore a discovery set before choosing someone else’s signature scent.</p><button class="link" data-action="samples">See the sample set →</button></div><div class="path"><span class="eyebrow">03 / Into the details</span><h3>Follow your nose.</h3><p>Compare note profiles, save discoveries, and find your next direction.</p><button class="link" data-action="library">Open the scent library →</button></div></div></section>${collection('A few places to start.')}${footer()}`}
function filtered(){return products.filter(p=>(state.library!=='Saved'||state.saved.includes(p.id))&&(state.filter==='All'||p.mood===state.filter)&&(state.budget==='All'||p.price<=Number(state.budget))&&(!state.query||`${p.name} ${p.family} ${p.notes}`.toLowerCase().includes(state.query.toLowerCase())))}
function rows(){const ps=filtered();return `<p class="count">${ps.length} fragrance${ps.length===1?'':'s'} · Illustrative EnveeSage collection</p>${ps.length?ps.map(p=>`<article class="row"><div class="mini">${bottle(p)}</div><div><h3>${p.name}</h3><p>${p.family} · EDP · 50 ml</p></div><div class="notes"><p>${p.notes}</p><p style="margin-top:7px">${p.wear}</p></div><div class="price">${money(p.price)}<p>2 ml / ${money(p.sample)}</p></div><button data-action="product" data-id="${p.id}">View scent ↗</button></article>`).join(''):'<p class="empty">No scents match yet. Try another filter or save a fragrance.</p>'}`}
function library(){return `<div class="library fade">${header()}<div class="libshell"><aside class="sidebar"><div class="eyebrow">Your scent space</div>${['Browse','Saved','Compare'].map(x=>`<button data-library="${x}" class="${state.library===x?'active':''}">${x}${x==='Saved'?' / '+state.saved.length:''}</button>`).join('')}<button data-action="learn">Scent glossary</button><p>Explore at your own depth.<br>Notes describe a scent.<br>Ingredients describe its formula.</p></aside><section class="workspace"><div class="workspace-head"><div><div class="eyebrow">EnveeSage / The scent library</div><h1>${state.library==='Saved'?'Your saved discoveries.':'Find your next direction.'}</h1><p class="muted">A closer look at the fragrances that interest you.</p></div><button class="primary" data-action="samples">Build a sample set ↗</button></div><div class="filters"><input id="search" aria-label="Search fragrance or notes" placeholder="Search fragrance, cedar, citrus…" value="${esc(state.query)}"><select id="family" aria-label="Scent family">${['All','Fresh','Woody','Warm'].map(x=>`<option ${state.filter===x?'selected':''}>${x}</option>`).join('')}</select><select id="budget" aria-label="Maximum bottle price"><option value="All">Any budget</option>${[50000,75000,100000].map(x=>`<option value="${x}" ${state.budget===String(x)?'selected':''}>Up to ${money(x)}</option>`).join('')}</select></div><div id="rows">${rows()}</div><div class="inspector"><div><div class="eyebrow">Make it personal</div><h3>Your nose is the best filter.</h3><p>Open a scent to save it, compare the profiles, or add a sample. Wear descriptions are illustrative and experiences vary.</p></div><div><div class="eyebrow">Know what you’re buying</div><h3>Look beyond the note list.</h3><p>Product detail separates notes, ingredient information and supplier provenance. Verification status needs supporting documents.</p></div></div></section></div>${footer()}</div>`}
function render(){document.getElementById('app').innerHTML=(state.variant==='A'?editorial():state.variant==='B'?guided():library())+`<div class="note">Design prototype: scents, prices, stock and delivery figures are fictional. Hero image is AI-generated mood photography, not an actual stocked product. No orders or payments are processed.</div><div class="statebox"><details><summary>Prototype state & design question</summary><p>Which structure helps first-time buyers and enthusiasts choose confidently: boutique, guided studio, or library?</p><pre id="state"></pre></details></div>`;document.getElementById('variant-label').textContent=state.variant+' / '+names[state.variant];updateState()}
function updateState(){const el=document.getElementById('state');if(el)el.textContent=JSON.stringify(state,null,2);console.log('Prototype state',JSON.stringify(state))}
function switchVariant(v){close();state.variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u);render();window.scrollTo(0,0)}function cycle(n){switchVariant(keys[(keys.indexOf(state.variant)+n+3)%3])}
function toast(msg){document.getElementById('toast').innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',3500)}
let opener;function drawer(title,body){opener=document.activeElement;document.getElementById("app").inert=true;document.querySelector(".switcher").inert=true;document.getElementById('modal').innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawerhead"><span class="eyebrow">EnveeSage / ${esc(title)}</span><button data-action="close" aria-label="Close dialog">×</button></div>${body}</section></div>`;document.body.style.overflow='hidden';document.querySelector('[data-action="close"]').focus()}
function close(){document.getElementById('app').inert=false;document.querySelector('.switcher').inert=false;document.getElementById('modal').innerHTML='';document.body.style.overflow='';if(opener?.isConnected)opener.focus()}
function detail(id){const p=byid(id);drawer('Scent detail',`<div class="art" style="background:${p.color}">${bottle(p)}</div><div class="eyebrow">${p.family} / Eau de parfum</div><h2 style="margin-top:12px">${p.name}</h2><p>${p.description}</p><h3>Choose your size</h3><button class="primary" data-action="add" data-id="${id}" data-size="sample">Add 2 ml sample · ${money(p.sample)} →</button><button class="secondary" data-action="add" data-id="${id}" data-size="bottle">Add 50 ml bottle · ${money(p.price)}</button><div style="display:flex;gap:25px"><button class="link" data-action="save" data-id="${id}">${state.saved.includes(id)?'♥ Saved':'♡ Save scent'}</button><button class="link" data-action="compare" data-id="${id}">Compare profile +</button></div><details open><summary>What does it smell like?</summary><p>${p.notes}. ${p.wear}. Scent descriptions are not ingredients or a guaranteed wear time.</p></details><details><summary>Ingredients & sensitivity</summary><p>Demo product: ingredient list is unavailable. Live products need supplied ingredient labels and warnings. Do not infer allergens or safety from scent notes. No fragrance can be assumed suitable for everyone.</p></details><details><summary>Source & product registration</summary><p>Illustrative product. Supplier, origin, batch information, registration records and provenance documents are not provided. No authenticity or regulatory verification is claimed.</p></details><p class="muted">Sample packaging and labeling need validation before launch.</p>`)}
function samples(){drawer('Discovery set',`<h2>Three scents.<br>Your own pace.</h2><p>A 2 ml sample of each fragrance. Explore fresh, woody and warm profiles before choosing a bottle.</p>${products.map(p=>`<div class="lineitem"><span>${p.name}<br><span class="muted">${p.family} · 2 ml</span></span><span>${money(p.sample)}</span></div>`).join('')}<button class="primary" data-action="addset">Add all three · ₦10,500 →</button><p class="muted">Illustrative samples. No redemption credit is assumed. Decanting, labeling and carrier acceptance must be validated before launch.</p>`)}
function subtotal(){return state.cart.reduce((s,i)=>s+(i.size==='sample'?byid(i.id).sample:byid(i.id).price),0)}
function totals(){const n=subtotal(),fee=state.delivery==='Lagos'?3500:state.delivery==='Abuja (FCT)'?5000:state.delivery==='Rivers'?6000:7500;return `<div class="lineitem"><span>Products</span><span>${money(n)}</span></div><div class="lineitem"><span>Illustrative delivery<br><span class="muted">${state.delivery==='Lagos'?'2–4':'4–7'} working days</span></span><span>${money(n?fee:0)}</span></div><div class="lineitem"><strong>Total to review</strong><strong>${money(n?n+fee:0)}</strong></div>`}
function bag(){drawer('Your bag',`<h2>Your next discoveries.</h2>${state.cart.length?state.cart.map((i,x)=>{const p=byid(i.id);return `<div class="lineitem"><span>${p.name}<br><span class="muted">${i.size==='sample'?'2 ml sample':'50 ml bottle'}</span><br><button class="link" data-remove="${x}">Remove</button></span><span>${money(i.size==='sample'?p.sample:p.price)}</span></div>`}).join(''):'<p>Your bag is empty. Start with a sample.</p>'}<h3>Delivery destination</h3><label for="delivery">Choose your state</label><select id="delivery">${['Lagos','Abuja (FCT)','Rivers','Other states'].map(x=>`<option ${state.delivery===x?'selected':''}>${x}</option>`).join('')}</select><div id="totals">${totals()}</div>${state.cart.length?'<button class="primary" data-action="checkout">Preview payment step →</button>':'<button class="primary" data-action="samples">Explore samples →</button>'}<p class="muted">Delivery charges and dates are placeholders, not courier quotes.</p>`)}
function comparison(){drawer('Compare scents',`<h2>Follow the differences.</h2><p>Choose “Compare profile” inside a scent to add it here.</p>${state.compare.length?state.compare.map(id=>{const p=byid(id);return `<div class="lineitem"><div><h3 style="margin:0 0 10px">${p.name}</h3><p>${p.notes}<br>${p.wear}<br>${money(p.price)} / sample ${money(p.sample)}</p><button class="link" data-action="product" data-id="${id}">View scent →</button></div><button class="link" data-uncompare="${id}">Remove</button></div>`}).join(''):'<p class="empty">No scents selected yet.</p>'}<p class="muted">Profiles are illustrative. Concentration and notes alone cannot predict longevity.</p>`)}
function deliveryInfo(){drawer('Delivery information',`<h2>Where is your scent headed?</h2><p>Nigeria-first delivery. The demo includes Lagos, FCT, Rivers and other states, with illustrative fees and windows.</p><h3>Before a real order</h3><p>Show an area-based courier quote, final charges, stock availability, dispatch estimate, and terms for failed delivery before payment.</p><h3>Careful handling</h3><p>Carrier acceptance, packaging and delivery zones need confirmation with the actual courier, especially for alcohol-based products.</p>`)}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const id=Number(t.dataset.id);if(t.dataset.choice){state.answers[questions[state.quizStep].key]=t.dataset.choice;document.getElementById('quiz').innerHTML=quiz();updateState();return}if(t.dataset.library){if(t.dataset.library==='Compare')comparison();else{state.library=t.dataset.library;render()}return}if(t.dataset.remove!==undefined){state.cart.splice(Number(t.dataset.remove),1);render();bag();return}if(t.dataset.uncompare){state.compare=state.compare.filter(x=>x!==Number(t.dataset.uncompare));comparison();updateState();return}switch(t.dataset.action){case'close':close();break;case'finder':switchVariant('B');break;case'library':switchVariant('C');break;case'browse':if(state.variant==='C'){state.library='Browse';render()}else document.getElementById('collection')?.scrollIntoView({behavior:'smooth'});break;case'product':detail(id);break;case'samples':samples();break;case'save':{const open=!!document.querySelector('.overlay');state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];render();if(open)detail(id);toast(state.saved.includes(id)?'Saved to your discoveries.':'Removed from saved discoveries.');break}case'saved':state.library='Saved';switchVariant('C');break;case'compare':if(!state.compare.includes(id))state.compare.push(id);comparison();updateState();break;case'add':state.cart.push({id,size:t.dataset.size});render();bag();toast('Added to your demo bag.');break;case'addset':products.forEach(p=>state.cart.push({id:p.id,size:'sample'}));render();bag();break;case'bag':bag();break;case'delivery':deliveryInfo();break;case'checkout':drawer('Payment preview',`<h2>Ready when you are.</h2><p>This is the end of the prototype checkout. A live checkout will confirm contact details, address, fees and return terms before payment.</p><h3>Payment options to validate</h3><p>Card and bank transfer through a Nigerian provider. An initiated transfer remains pending until server-side payment verification.</p><button class="primary" data-action="bag">Back to my bag →</button><p class="muted">No payment is taken and no order is placed.</p>`);break;case'learn':drawer('Scent notes',`<h2>A little scent vocabulary.</h2><h3>Notes</h3><p>A vocabulary for how a perfume smells. “Amber” can describe an accord rather than a single ingredient.</p><h3>Eau de parfum</h3><p>A product concentration description. It does not, by itself, promise how long a fragrance will last.</p><h3>Projection</h3><p>How far a scent seems to travel from your skin. It varies by person, setting and application.</p><h3>Sampling</h3><p>Trying a small amount helps you discover your own preference. A scent suggestion is a starting point.</p>`);break;case'quiznext':if(!state.answers[questions[state.quizStep].key]){toast('Choose an option to continue.');return}state.quizStep++;document.getElementById('quiz').innerHTML=quiz();updateState();break;case'quizback':if(state.quizStep){state.quizStep--;document.getElementById('quiz').innerHTML=quiz();updateState()}else document.getElementById('collection').scrollIntoView({behavior:'smooth'});break;case'resetquiz':state.quizStep=0;state.answers={};document.getElementById('quiz').innerHTML=quiz();updateState();break;}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;document.getElementById('rows').innerHTML=rows();updateState()}});document.addEventListener('change',e=>{if(e.target.id==='family'||e.target.id==='budget'){state[e.target.id==='family'?'filter':'budget']=e.target.value;document.getElementById('rows').innerHTML=rows();updateState()}if(e.target.id==='delivery'){state.delivery=e.target.value;document.getElementById('totals').innerHTML=totals();updateState()}});
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{const dialog=document.querySelector('.drawer');if(dialog){if(e.key==='Escape')close();if(e.key==='Tab'){const els=[...dialog.querySelectorAll('button,a,input,select,summary')].filter(x=>x.getClientRects().length),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'){e.preventDefault();cycle(-1)}if(e.key==='ArrowRight'){e.preventDefault();cycle(1)}});render();
</script></body></html>
